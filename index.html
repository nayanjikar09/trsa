<!DOCTYPE html>
<html>
<head>
    <title>Nadi Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .box {
            width: 420px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: slideIn 1s ease;
            transition: transform 0.3s ease;
        }

        .box:hover {
            transform: translateY(-5px);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(to right, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102,126,234,0.6);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 20px rgba(102,126,234,0.5);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(118,75,162,0.7);
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            animation: fadeIn 1s ease;
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 30px;
            margin-top: 10px;
            color: white;
            animation: pop 0.6s ease;
        }

        .Vata { background: #ff7675; }
        .Pitta { background: #fdcb6e; color: #333; }
        .Kapha { background: #55efc4; color: #333; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pop {
            0% { transform: scale(0.7); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>
<div class="box">
    <h2>🌿 Nadi Analyzer</h2>

    <form method="POST">
        <input type="number" step="any" name="pulse_rate" placeholder="Pulse Rate (bpm)" required>
        <input type="number" step="any" name="rr_interval" placeholder="RR Interval (sec)" required>
        <input type="number" step="any" name="pulse_amplitude" placeholder="Pulse Amplitude" required>
        <input type="number" step="any" name="pulse_variability" placeholder="Pulse Variability" required>
        <button type="submit">Analyze Dosha</button>
    </form>

    {% if prediction %}
        <div class="result">
            Predicted Dosha
            <div class="badge {{ prediction }}">{{ prediction }}</div>
        </div>
    {% endif %}
</div>
</body>
</html>
